    <script>
      (() => {
        let readyMarked = false;
        const markReady = () => {
          if (readyMarked) return;
          readyMarked = true;
          try {
            document.documentElement.classList.add("fa-ready");
          } catch {}
        };
        const isReady = () => {
          try {
            if (!document.fonts || typeof document.fonts.check !== "function") {
              return true;
            }
            return (
              document.fonts.check('16px "Font Awesome 6 Free"') ||
              document.fonts.check("16px FontAwesome")
            );
          } catch {
            return true;
          }
        };

        const primeFonts = async () => {
          try {
            if (!document.fonts || typeof document.fonts.load !== "function") {
              return;
            }
            await Promise.allSettled([
              document.fonts.load('900 16px "Font Awesome 6 Free"'),
              document.fonts.load('400 16px "Font Awesome 6 Free"'),
            ]);
          } catch {}
        };

        const bootstrap = async () => {
          if (isReady()) {
            markReady();
            return;
          }

          await primeFonts();
          if (isReady()) {
            markReady();
            return;
          }

          try {
            if (document.fonts && document.fonts.ready) {
              await Promise.race([
                document.fonts.ready,
                new Promise((resolve) => setTimeout(resolve, 1200)),
              ]);
            }
          } catch {}

          // Prevent permanent fallback mode if font checks lag or fail to report.
          markReady();
        };

        bootstrap();
      })();
    </script>

    <script src="utils/i18n-ui.js"></script>
    <script>
      let overlayLang = "english";
      let overlayUiLang = "english";
      let overlayPrefs = null;
      let overlayPrefsLoaded = false;
      const OVERLAY_ACH_TABLE_STATUS_SEQUENCE = ["all", "locked", "unlocked"];
      const OVERLAY_ACH_TABLE_SORT_SEQUENCE = ["off", "asc", "desc"];
      const OVERLAY_ACH_TABLE_STORE = {
        status: "achTable:status",
        nameSort: "achTable:nameSort",
        timeSort: "achTable:timeSort",
        raritySort: "achTable:raritySort",
      };
      function normalizeAppTheme(value) {
        if (window.AppTheme?.normalizeAppTheme) {
          return window.AppTheme.normalizeAppTheme(value);
        }
        return "dracula";
      }
      function applyAppTheme(value) {
        if (window.AppTheme?.applyAppThemeToDocument) {
          window.AppTheme.applyAppThemeToDocument(value);
          return;
        }
        document.documentElement.dataset.theme = normalizeAppTheme(value);
      }
      function registerOverlayThemes(payload) {
        if (window.AppTheme?.registerAppThemes && Array.isArray(payload?.themes)) {
          window.AppTheme.registerAppThemes(payload.themes);
        }
      }
      async function loadOverlayThemes() {
        try {
          if (typeof window.api?.listAppThemes === "function") {
            registerOverlayThemes(await window.api.listAppThemes());
          }
        } catch {}
      }
      const overlayAchievementTableViewState = {
        status: "all",
        nameSort: "off",
        timeSort: "off",
        raritySort: "off",
      };
      const tUi = (key, fallback) =>
        window.i18nUi && typeof window.i18nUi.getString === "function"
          ? window.i18nUi.getString(key, fallback)
          : fallback;
      const faWithFallback = (iconClasses, fallbackChar) =>
        `<i class="${iconClasses} fa-icon" aria-hidden="true"></i><span class="fa-fallback" aria-hidden="true">${fallbackChar}</span>`;

      function readOverlayAchTableStore(key) {
        try {
          return localStorage.getItem(key);
        } catch {
          return null;
        }
      }

      function writeOverlayAchTableStore(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch {}
      }

      function normalizeOverlayAchievementTableStatus(status) {
        return OVERLAY_ACH_TABLE_STATUS_SEQUENCE.includes(status)
          ? status
          : "all";
      }

      function normalizeOverlayAchievementTableSort(sortState) {
        return OVERLAY_ACH_TABLE_SORT_SEQUENCE.includes(sortState)
          ? sortState
          : "off";
      }

      function normalizeOverlayAchievementTableState(payload) {
        if (!payload || typeof payload !== "object") return null;
        return {
          status: normalizeOverlayAchievementTableStatus(
            String(payload.status || "")
              .trim()
              .toLowerCase(),
          ),
          nameSort: normalizeOverlayAchievementTableSort(
            String(payload.nameSort || "")
              .trim()
              .toLowerCase(),
          ),
          timeSort: normalizeOverlayAchievementTableSort(
            String(payload.timeSort || "")
              .trim()
              .toLowerCase(),
          ),
          raritySort: normalizeOverlayAchievementTableSort(
            String(payload.raritySort || "")
              .trim()
              .toLowerCase(),
          ),
        };
      }

      function hydrateOverlayAchievementTableViewStateFromStorage() {
        const stored = normalizeOverlayAchievementTableState({
          status: readOverlayAchTableStore(OVERLAY_ACH_TABLE_STORE.status),
          nameSort: readOverlayAchTableStore(OVERLAY_ACH_TABLE_STORE.nameSort),
          timeSort: readOverlayAchTableStore(OVERLAY_ACH_TABLE_STORE.timeSort),
          raritySort: readOverlayAchTableStore(
            OVERLAY_ACH_TABLE_STORE.raritySort,
          ),
        });
        if (!stored) return;
        overlayAchievementTableViewState.status = stored.status;
        overlayAchievementTableViewState.nameSort = stored.nameSort;
        overlayAchievementTableViewState.timeSort = stored.timeSort;
        overlayAchievementTableViewState.raritySort = stored.raritySort;
      }

      function persistOverlayAchievementTableViewStateToStorage() {
        writeOverlayAchTableStore(
          OVERLAY_ACH_TABLE_STORE.status,
          overlayAchievementTableViewState.status,
        );
        writeOverlayAchTableStore(
          OVERLAY_ACH_TABLE_STORE.nameSort,
          overlayAchievementTableViewState.nameSort,
        );
        writeOverlayAchTableStore(
          OVERLAY_ACH_TABLE_STORE.timeSort,
          overlayAchievementTableViewState.timeSort,
        );
        writeOverlayAchTableStore(
          OVERLAY_ACH_TABLE_STORE.raritySort,
          overlayAchievementTableViewState.raritySort,
        );
      }

      async function loadOverlayPrefs() {
        if (overlayPrefsLoaded && overlayPrefs) return overlayPrefs;
        try {
          await loadOverlayThemes();
          overlayPrefs = await window.api.loadPreferences?.();
          applyAppTheme(overlayPrefs?.appTheme);
          overlayPrefsLoaded = true;
        } catch (e) {
          overlayPrefs = null;
          overlayPrefsLoaded = false;
          applyAppTheme(null);
        }
        return overlayPrefs || {};
      }
      loadOverlayPrefs().catch(() => {});

      let currentConfigName = null;
      let currentDataHash = null;
      let isLoading = false;
      let pendingConfigName = null;
      let pendingVisibilityAckPayload = null;

      function dispatchOverlayVisibilityAck(payload, reason = "immediate") {
        if (!payload) return;
        const ackPayload = {
          ...payload,
          cssHidden: document.body.classList.contains("overlay-hidden"),
          documentHidden: !!document.hidden,
          reason,
        };
        requestAnimationFrame(() => {
          try {
            window.api?.overlayVisibilityAck?.(ackPayload);
          } catch {}
        });
      }

      function flushOverlayVisibilityAck(reason = "flush") {
        if (!pendingVisibilityAckPayload) return;
        if (pendingVisibilityAckPayload.visible && isLoading) return;
        const payload = pendingVisibilityAckPayload;
        pendingVisibilityAckPayload = null;
        dispatchOverlayVisibilityAck(payload, reason);
      }

      function getAppIconUrl() {
        const q = new URLSearchParams(location.search).get("icon");
        return q ? decodeURIComponent(q) : "";
      }
      function resolveAchievementIcon(imgEl, cfgPath, rel) {
        const FALLBACK = getAppIconUrl();
        const r = String(rel || "");
        const base = r.split(/[\\/]/).pop();

        const candidates = []
          .concat(r ? [`${cfgPath}\\${r}`] : [])
          .concat([
            `${cfgPath}\\achievement_images\\${base}`,
            `${cfgPath}\\steam_settings\\achievement_images\\${base}`,
            `${cfgPath}\\img\\${base}`,
            `${cfgPath}\\images\\${base}`,
          ])
          .filter((v, i, a) => v && a.indexOf(v) === i)
          .map((p) => `file:///${p.replace(/\\/g, "/")}`);

        let i = 0;
        const tryNext = () => {
          if (i >= candidates.length) {
            imgEl.src = FALLBACK;
            return;
          }
          imgEl.onerror = () => {
            i++;
            tryNext();
          };
          imgEl.src = candidates[i];
        };
        tryNext();
      }

      async function applyOverlayLanguage() {
        const prefs = await loadOverlayPrefs();
        const lang = prefs?.uiLanguage || prefs?.language || "english";
        overlayUiLang = String(lang || "english");
        if (
          window.i18nUi &&
          typeof window.i18nUi.setUiLanguage === "function"
        ) {
          await window.i18nUi.setUiLanguage(overlayUiLang);
        }
      }

      function getSafeLocalizedText(input, lang = "english") {
        const hiddenFallback = tUi("overlay.hiddenFallback", "Hidden");
        if (!input) return hiddenFallback;
        if (typeof input === "string") return input.trim() || hiddenFallback;
        if (typeof input === "object") {
          const requestedLang = String(lang || "english").trim();
          const requestedLower = requestedLang.toLowerCase();
          if (
            requestedLang &&
            typeof input[requestedLang] === "string" &&
            input[requestedLang].trim() !== ""
          ) {
            return input[requestedLang];
          }
          const caseInsensitiveKey = Object.keys(input).find((key) => {
            return (
              String(key || "").toLowerCase() === requestedLower &&
              typeof input[key] === "string" &&
              input[key].trim() !== ""
            );
          });
          if (caseInsensitiveKey) {
            return input[caseInsensitiveKey];
          }
          return (
            input.english ||
            Object.values(input).find(
              (v) => typeof v === "string" && v.trim() !== "",
            ) ||
            hiddenFallback
          );
        }
        return hiddenFallback;
      }

      function getEffectiveAchievementProgress(saved) {
        const isEarned = saved?.earned === true || saved?.earned === 1;
        const rawProgress = Number(saved?.progress);
        const rawMax = Number(saved?.max_progress);
        const hasProgress = Number.isFinite(rawProgress);
        const hasMax = Number.isFinite(rawMax) && rawMax > 0;

        if (!hasProgress || !hasMax) {
          return {
            show: false,
            progress: null,
            max: hasMax ? rawMax : null,
            percent: null,
          };
        }

        if (isEarned) {
          return {
            show: true,
            progress: rawMax,
            max: rawMax,
            percent: 100,
          };
        }

        return {
          show: true,
          progress: rawProgress,
          max: rawMax,
          percent: Math.min(100, Math.round((rawProgress / rawMax) * 100)),
        };
      }

      function normalizeEarnedTime(raw) {
        const t = Number(raw);
        if (!Number.isFinite(t) || t <= 0) return 0;
        const ms = String(Math.trunc(t)).length === 10 ? t * 1000 : t;
        return ms >= 946684800000 ? ms : 0;
      }

      function formatTimestamp(timestamp) {
        const ms = normalizeEarnedTime(timestamp);
        if (!ms) return tUi("overlay.notAvailable", "N/A");
        const d = new Date(ms);
        return isNaN(d)
          ? tUi("overlay.notAvailable", "N/A")
          : d.toLocaleString();
      }

      function computeAchievementsHash(achievements, saved, lang) {
        return achievements
          .map((ach) => {
            const name = ach.name;
            const display = getSafeLocalizedText(ach.displayName, lang);
            const rarity =
              ach?.rarityPct ??
              ach?.rarity_percent ??
              ach?.unlockRate ??
              ach?.unlock_rate ??
              ach?.globalPercent ??
              ach?.global_percent ??
              ach?.percent ??
              (typeof ach?.rarity === "object"
                ? ach?.rarity?.pct ??
                  ach?.rarity?.percent ??
                  ach?.rarity?.value ??
                  ""
                : ach?.rarity ?? "");
            const trophyType = formatTrophyTypeAsRarity(
              ach?.trophyType || ach?.trophy_type,
            );
            const savedData = saved?.achievements?.[name] || {};
            const earned = savedData.earned ? "1" : "0";
            const progress = savedData.progress ?? "";
            const max = savedData.max_progress ?? "";
            return `${name}-${display}-${rarity}-${trophyType}-${earned}-${progress}-${max}`;
          })
          .join("|");
      }

      function parseRarityPercent(raw) {
        if (raw === null || raw === undefined) return null;
        if (typeof raw === "number" && Number.isFinite(raw)) {
          return Math.min(100, Math.max(0, raw));
        }
        if (typeof raw === "string") {
          const normalized = raw.replace(",", ".").trim();
          if (!normalized) return null;
          const m = normalized.match(/-?\d+(?:\.\d+)?/);
          if (!m) return null;
          const n = Number(m[0]);
          if (!Number.isFinite(n)) return null;
          return Math.min(100, Math.max(0, n));
        }
        return null;
      }

      function resolveRarityPercent(achievement) {
        const rarityObj = achievement?.rarity;
        if (rarityObj && typeof rarityObj === "object") {
          const nested =
            parseRarityPercent(rarityObj.pct) ??
            parseRarityPercent(rarityObj.percent) ??
            parseRarityPercent(rarityObj.value);
          if (nested !== null) return nested;
        }
        const candidates = [
          achievement?.rarityPct,
          achievement?.rarity_percent,
          achievement?.unlockRate,
          achievement?.unlock_rate,
          achievement?.globalPercent,
          achievement?.global_percent,
          achievement?.percent,
          typeof achievement?.rarity === "number" ||
          typeof achievement?.rarity === "string"
            ? achievement.rarity
            : null,
        ];
        for (const candidate of candidates) {
          const parsed = parseRarityPercent(candidate);
          if (parsed !== null) return parsed;
        }
        return null;
      }

      function mapTrophyTypeToRaritySortValue(rawType) {
        const normalized = String(rawType || "")
          .trim()
          .toLowerCase();
        if (!normalized || normalized === "unknown") return null;
        if (normalized === "p" || normalized === "platinum") return 0;
        if (normalized === "g" || normalized === "gold") return 1;
        if (normalized === "s" || normalized === "silver") return 2;
        if (normalized === "b" || normalized === "bronze") return 3;
        return null;
      }

      function resolveRaritySortValue(
        achievement,
        { useTrophyTypeRaritySortFallback = false } = {},
      ) {
        const rarityPercent = resolveRarityPercent(achievement);
        if (rarityPercent !== null) return rarityPercent;
        if (!useTrophyTypeRaritySortFallback) return null;
        return mapTrophyTypeToRaritySortValue(
          achievement?.trophyType || achievement?.trophy_type,
        );
      }

      function resolveRarityGlowTierClass(achievement) {
        const rarityPct = resolveRarityPercent(achievement);
        if (rarityPct === null) return "";
        if (rarityPct <= 1) return "rarity-tier-gold";
        if (rarityPct <= 5) return "rarity-tier-silver";
        if (rarityPct <= 10) return "rarity-tier-bronze";
        return "";
      }

      function formatTrophyTypeAsRarity(rawType) {
        const normalized = String(rawType || "")
          .trim()
          .toLowerCase();
        if (!normalized || normalized === "unknown") return "";
        if (normalized === "p" || normalized === "platinum") return "Platinum";
        if (normalized === "g" || normalized === "gold") return "Gold";
        if (normalized === "s" || normalized === "silver") return "Silver";
        if (normalized === "b" || normalized === "bronze") return "Bronze";
        return normalized.charAt(0).toUpperCase() + normalized.slice(1);
      }

      function formatRarityPercent(achievement) {
        const rarityPct = resolveRarityPercent(achievement);
        const trophyType = formatTrophyTypeAsRarity(
          achievement?.trophyType || achievement?.trophy_type,
        );
        if (rarityPct !== null) {
          const rounded = Number.isInteger(rarityPct)
            ? String(rarityPct)
            : String(rarityPct.toFixed(2)).replace(/\.?0+$/, "");
          if (trophyType) return `${trophyType} · ${rounded}%`;
          return `${rounded}%`;
        }
        if (trophyType) return trophyType;
        return "N/A";
      }

      function getOverlayAchievementItemDefaultIndex(item) {
        const n = Number(item?.dataset?.defaultIndex);
        return Number.isFinite(n) ? n : 0;
      }

      function getOverlayAchievementItemNumericValue(item, key) {
        const raw = item?.dataset?.[key];
        if (raw === undefined || raw === null || raw === "") return null;
        const n = Number(raw);
        return Number.isFinite(n) ? n : null;
      }

      function compareNullableOverlayAchievementValues(
        a,
        b,
        direction = "asc",
      ) {
        if (a === null && b === null) return 0;
        if (a === null) return 1;
        if (b === null) return -1;
        return direction === "desc" ? b - a : a - b;
      }

      function compareOverlayAchievementItemsByCurrentSort(itemA, itemB) {
        const fallback =
          getOverlayAchievementItemDefaultIndex(itemA) -
          getOverlayAchievementItemDefaultIndex(itemB);

        if (overlayAchievementTableViewState.nameSort !== "off") {
          const aName = String(itemA?.dataset?.sortName || "");
          const bName = String(itemB?.dataset?.sortName || "");
          const cmp = aName.localeCompare(bName, undefined, {
            sensitivity: "base",
          });
          if (cmp !== 0) {
            return overlayAchievementTableViewState.nameSort === "desc"
              ? -cmp
              : cmp;
          }
          return fallback;
        }

        if (overlayAchievementTableViewState.timeSort !== "off") {
          const aValue = getOverlayAchievementItemNumericValue(
            itemA,
            "sortEarnedTime",
          );
          const bValue = getOverlayAchievementItemNumericValue(
            itemB,
            "sortEarnedTime",
          );
          const cmp = compareNullableOverlayAchievementValues(
            aValue,
            bValue,
            overlayAchievementTableViewState.timeSort,
          );
          if (cmp !== 0) return cmp;
          return fallback;
        }

        if (overlayAchievementTableViewState.raritySort !== "off") {
          const aValue = getOverlayAchievementItemNumericValue(
            itemA,
            "sortRarity",
          );
          const bValue = getOverlayAchievementItemNumericValue(
            itemB,
            "sortRarity",
          );
          const cmp = compareNullableOverlayAchievementValues(
            aValue,
            bValue,
            overlayAchievementTableViewState.raritySort,
          );
          if (cmp !== 0) return cmp;
          return fallback;
        }

        return fallback;
      }

      function applyOverlayAchievementViewState() {
        const achievementsList = document.getElementById("achievements-list");
        if (!achievementsList) return;
        const items = Array.from(
          achievementsList.querySelectorAll("li.achievement-item"),
        );
        if (!items.length) return;

        items.sort(compareOverlayAchievementItemsByCurrentSort);
        const frag = document.createDocumentFragment();
        items.forEach((item) => frag.appendChild(item));
        achievementsList.appendChild(frag);

        items.forEach((item) => {
          const isUnlocked = item?.dataset?.sortUnlocked === "1";
          const statusMatches =
            overlayAchievementTableViewState.status === "all" ||
            (overlayAchievementTableViewState.status === "locked" &&
              !isUnlocked) ||
            (overlayAchievementTableViewState.status === "unlocked" &&
              isUnlocked);
          item.style.display = statusMatches ? "" : "none";
        });
      }

      function applyOverlayAchievementTableViewState(payload) {
        const normalized = normalizeOverlayAchievementTableState(payload);
        if (!normalized) return;
        overlayAchievementTableViewState.status = normalized.status;
        overlayAchievementTableViewState.nameSort = normalized.nameSort;
        overlayAchievementTableViewState.timeSort = normalized.timeSort;
        overlayAchievementTableViewState.raritySort = normalized.raritySort;
        persistOverlayAchievementTableViewStateToStorage();
        applyOverlayAchievementViewState();
      }

      hydrateOverlayAchievementTableViewStateFromStorage();

      function updateStats(achievements, savedData) {
        const total = achievements.length;
        const unlocked = achievements.reduce((count, ach) => {
          const saved = savedData?.achievements?.[ach.name];
          return count + (saved?.earned ? 1 : 0);
        }, 0);

        const percentage = total > 0 ? Math.round((unlocked / total) * 100) : 0;
        const fillEl = document.getElementById("progress-fill");
        if (!fillEl) return;

        if (percentage === 0) {
          const prevTransition = fillEl.style.transition;
          fillEl.style.transition = "none";
          fillEl.style.width = "0%";
          void fillEl.offsetWidth;
          requestAnimationFrame(() => {
            fillEl.style.transition = prevTransition;
          });
        } else {
          fillEl.style.width = `${percentage}%`;
        }

        document
          .getElementById("achievement-count")
          .querySelector(".value").textContent = `${unlocked}/${total}`;
        document.getElementById("completion-percentage").textContent =
          `${percentage}%`;
      }

      async function loadAchievements(configName) {
        const achievementsList = document.getElementById("achievements-list");
        const emptyState = document.getElementById("empty-state");

        if (!configName) return;

        if (isLoading) {
          pendingConfigName = configName;
          return;
        }
        isLoading = true;
        pendingConfigName = null;

        try {
          await applyOverlayLanguage();
          const configMeta = await window.api.getConfigByName?.(configName);
          const platformForRaritySort = String(configMeta?.platform || "")
            .trim()
            .toLowerCase();
          const useTrophyTypeRaritySortFallback =
            platformForRaritySort === "rpcs3" ||
            platformForRaritySort === "shadps4";
          const achievementsDataObj =
            await window.api.loadAchievementData(configName, {
              includeRarity: true,
            });
          const savedAchievementsObj =
            await window.api.loadSavedAchievements(configName);
          const lang = overlayLang;
          const prefs = await loadOverlayPrefs();

          if (!Array.isArray(achievementsDataObj.achievements)) {
            emptyState.style.display = "flex";
            achievementsList.style.display = "none";
            updateStats([], null);
            document.body.classList.add("overlay-compact");
            currentConfigName = configName;
            currentDataHash = null;
            return;
          }

          const newHash = computeAchievementsHash(
            achievementsDataObj.achievements,
            savedAchievementsObj,
            lang,
          );
          if (pendingConfigName && pendingConfigName !== configName) return;

          const isSameConfig = currentConfigName === configName;
          const isSameHash = currentDataHash === newHash;
          if (isSameConfig && isSameHash) return;

          emptyState.style.display = "none";
          achievementsList.style.display = "block";
          achievementsList.innerHTML = "";
          document.body.classList.remove("overlay-compact");

          const uniqueAchievements = new Set();
          const achievements = [];

          achievementsDataObj.achievements.forEach((achievement) => {
            if (!achievement.name || uniqueAchievements.has(achievement.name))
              return;
            uniqueAchievements.add(achievement.name);
            achievements.push(achievement);
          });

          // Update stats
          updateStats(achievements, savedAchievementsObj);

          // Sort achievements: unlocked first, then locked
          achievements.sort((a, b) => {
            const aUnlocked = savedAchievementsObj?.achievements?.[a.name]
              ?.earned
              ? 1
              : 0;
            const bUnlocked = savedAchievementsObj?.achievements?.[b.name]
              ?.earned
              ? 1
              : 0;
            return bUnlocked - aUnlocked;
          });

          let defaultItemIndex = 0;
          achievements.forEach((achievement) => {
            const displayName = getSafeLocalizedText(
              achievement.displayName,
              lang,
            );
            const description = getSafeLocalizedText(
              achievement.description,
              lang,
            );
            const iconGray = achievement.icon_gray || achievement.icongray;
            const icon = achievement.icon || iconGray;
            const isHidden = Number(achievement.hidden) === 1;

            let statusHTML = `<div class="status-locked">${faWithFallback(
              "fas fa-lock",
              "🔒",
            )} ${tUi(
              "overlay.statusLocked",
              "Locked",
            )}</div>`;
            let earnedTimeHTML = "";
            let progressHTML = "";
            const rarityHTML = `<div class="achievement-rarity">${tUi("overlay.rarityLabel", "Rarity")}: ${formatRarityPercent(achievement)}</div>`;
            const saved =
              savedAchievementsObj?.achievements?.[achievement.name];
            const isUnlocked = !!saved?.earned;
            const rel = isUnlocked ? icon : iconGray;
            const showHidden = prefs?.showHiddenDescription === true;
            const effectiveProgress = getEffectiveAchievementProgress(saved);
            const descText =
              isHidden && !isUnlocked && !showHidden
                ? tUi("overlay.hiddenFallback", "Hidden")
                : description;
            const rarityPercentValue = resolveRarityPercent(achievement);

            if (saved?.earned) {
              statusHTML = `<div class="status-unlocked">${faWithFallback(
                "fas fa-unlock",
                "🔓",
              )} ${tUi(
                "overlay.statusUnlocked",
                "Unlocked",
              )}</div>`;
              earnedTimeHTML = `<div class="achievement-time">${formatTimestamp(
                saved.earned_time,
              )}</div>`;
            }

            if (effectiveProgress.show) {
              progressHTML = `
                    <div class="achievement-progress">
                    ${tUi("overlay.progressLabel", "Progress")}: ${effectiveProgress.progress} / ${effectiveProgress.max}
                    <div class="progress-bar" style="margin-top: 4px; height: 4px;">
                        <div class="progress-fill" style="width: ${effectiveProgress.percent}%;"></div>
                    </div>
                    </div>`;
            }

            const listItem = document.createElement("li");
            listItem.className = "achievement-item";
            const rarityGlowTierClass = resolveRarityGlowTierClass(achievement);
            listItem.dataset.defaultIndex = String(defaultItemIndex++);
            listItem.dataset.sortName = String(
              displayName || achievement.name || "",
            )
              .trim()
              .replace(/\s+/g, " ")
              .toLowerCase();
            listItem.dataset.sortUnlocked = isUnlocked ? "1" : "0";
            const earnedTimeValue = Number(saved?.earned_time);
            listItem.dataset.sortEarnedTime =
              Number.isFinite(earnedTimeValue) && earnedTimeValue > 0
                ? String(earnedTimeValue)
                : "";
            const raritySortValue = resolveRaritySortValue(achievement, {
              useTrophyTypeRaritySortFallback,
            });
            listItem.dataset.sortRarity =
              raritySortValue === null ? "" : String(raritySortValue);
            listItem.innerHTML = `
          <img class="achievement-icon" alt="Icon">
            <div class="achievement-info">
              <div class="achievement-name">${displayName}</div>
            <div class="achievement-description">${descText}</div>
            ${progressHTML}
          </div>
          <div class="achievement-status">
            ${statusHTML}
            ${earnedTimeHTML}
            ${rarityHTML}
          </div>
        `;
            achievementsList.appendChild(listItem);

            const imgEl = listItem.querySelector("img.achievement-icon");
            if (imgEl && rarityGlowTierClass) {
              imgEl.classList.add(rarityGlowTierClass);
            }
            resolveAchievementIcon(imgEl, achievementsDataObj.config_path, rel);
          });
          applyOverlayAchievementViewState();

          currentConfigName = configName;
          currentDataHash = newHash;
        } finally {
          isLoading = false;
          const next = pendingConfigName;
          pendingConfigName = null;
          if (next) {
            loadAchievements(next);
          } else {
            flushOverlayVisibilityAck("loadAchievements:finally");
          }
        }
      }

      window.api.onSetLanguage((payload) => {
        let contentLanguageChanged = false;
        let uiLanguageChanged = false;
        if (payload && typeof payload === "object") {
          if (payload.language) {
            const nextOverlayLang = String(payload.language || "english");
            contentLanguageChanged = nextOverlayLang !== overlayLang;
            overlayLang = nextOverlayLang;
          }
          if (payload.uiLanguage) {
            const nextUiLanguage = String(payload.uiLanguage || "english");
            uiLanguageChanged = nextUiLanguage !== overlayUiLang;
            overlayUiLang = nextUiLanguage;
            overlayPrefs = {
              ...(overlayPrefs || {}),
              uiLanguage: overlayUiLang,
            };
            if (
              window.i18nUi &&
              typeof window.i18nUi.setUiLanguage === "function"
            ) {
              window.i18nUi.setUiLanguage(overlayUiLang);
            }
          }
        } else {
          const nextOverlayLang = String(payload || "english");
          contentLanguageChanged = nextOverlayLang !== overlayLang;
          overlayLang = nextOverlayLang;
        }
        if (uiLanguageChanged || contentLanguageChanged) {
          currentDataHash = null;
        }
        if (currentConfigName && (uiLanguageChanged || contentLanguageChanged)) {
          loadAchievements(currentConfigName);
        }
      });

      window.api.onLoadOverlayData((configName) => {
        const achievementsList = document.getElementById("achievements-list");
        const emptyState = document.getElementById("empty-state");

        if (!configName) {
          achievementsList.innerHTML = "";
          emptyState.style.display = "flex";
          achievementsList.style.display = "none";
          updateStats([], null);
          document.body.classList.add("overlay-compact");
          currentConfigName = null;
          currentDataHash = null;
          pendingConfigName = null;
          isLoading = false;
          return;
        }

        if (configName !== currentConfigName) {
          currentDataHash = null;
        }
        currentConfigName = configName;
        pendingConfigName = null;

        loadAchievements(configName);
      });

      window.api.onRefreshAchievementsTable(() => {
        if (currentConfigName) {
          loadAchievements(currentConfigName);
        }
      });

      window.api.on("ach-table:view-state", (payload) => {
        applyOverlayAchievementTableViewState(payload);
      });

      window.api.on("overlay-preferences-updated", (payload) => {
        if (!payload || typeof payload !== "object") return;
        if (Object.prototype.hasOwnProperty.call(payload, "appTheme")) {
          registerOverlayThemes(payload);
          overlayPrefs = {
            ...(overlayPrefs || {}),
            appTheme: normalizeAppTheme(payload.appTheme),
          };
          overlayPrefsLoaded = true;
          applyAppTheme(overlayPrefs.appTheme);
        }
        if (
          Object.prototype.hasOwnProperty.call(payload, "showHiddenDescription")
        ) {
          overlayPrefs = {
            ...(overlayPrefs || {}),
            showHiddenDescription: payload.showHiddenDescription === true,
          };
          overlayPrefsLoaded = true;
          currentDataHash = null;
          if (currentConfigName) {
            loadAchievements(currentConfigName);
          }
        }
      });

      function setOverlayVisible(visible, source = null) {
        document.body.classList.toggle("overlay-hidden", !visible);
        const ackPayload = {
          visible: !!visible,
          source: source || null,
        };
        try {
          window.api?.logOverlayEvent?.(
            "debug",
            "overlay:renderer:set-visible",
            {
              ...ackPayload,
              cssHidden: document.body.classList.contains("overlay-hidden"),
              documentHidden: !!document.hidden,
              deferred: !!visible && isLoading,
            },
          );
        } catch {}
        if (visible && isLoading) {
          pendingVisibilityAckPayload = ackPayload;
          return;
        }
        pendingVisibilityAckPayload = null;
        dispatchOverlayVisibilityAck(ackPayload, "setOverlayVisible");
      }

      window.api.on("overlay:set-visible", (payload) => {
        const visible =
          payload && typeof payload === "object" ? payload.visible : payload;
        const source =
          payload && typeof payload === "object" && payload.source
            ? String(payload.source)
            : null;
        setOverlayVisible(!!visible, source);
      });

      function setupOverlayDrag() {
        const dragHandle = document.querySelector(".overlay-header");
        if (!dragHandle) return;
        if (
          !window.api ||
          typeof window.api.getWindowPosition !== "function" ||
          typeof window.api.setWindowPosition !== "function" ||
          typeof window.api.startOverlayDrag !== "function" ||
          typeof window.api.endOverlayDrag !== "function"
        ) {
          return;
        }

        let dragActive = false;

        const endDrag = () => {
          if (!dragActive) return;
          dragActive = false;
          window.api.endOverlayDrag();
          try {
            window.removeEventListener("mouseup", endDrag, true);
            document.removeEventListener("mouseup", endDrag, true);
          } catch {}
        };

        const startDrag = async (event) => {
          if (event.button !== 0) return;
          event.preventDefault();
          if (dragActive) return;

          let winX = Number(window.screenX);
          let winY = Number(window.screenY);
          try {
            const pos = await window.api.getWindowPosition();
            if (Array.isArray(pos) && pos.length >= 2) {
              const px = Number(pos[0]);
              const py = Number(pos[1]);
              if (Number.isFinite(px) && Number.isFinite(py)) {
                winX = px;
                winY = py;
              }
            }
          } catch {}

          if (!Number.isFinite(winX) || !Number.isFinite(winY)) return;

          const sx = Number(event.screenX);
          const sy = Number(event.screenY);
          const cx = Number(event.clientX);
          const cy = Number(event.clientY);
          const screenX = Number.isFinite(sx) ? sx : winX + cx;
          const screenY = Number.isFinite(sy) ? sy : winY + cy;

          if (!Number.isFinite(screenX) || !Number.isFinite(screenY)) return;

          const offsetX = screenX - winX;
          const offsetY = screenY - winY;
          if (!Number.isFinite(offsetX) || !Number.isFinite(offsetY)) return;

          dragActive = true;
          window.api.startOverlayDrag({ offsetX, offsetY });
          window.addEventListener("mouseup", endDrag, true);
          document.addEventListener("mouseup", endDrag, true);
        };

        dragHandle.addEventListener("mousedown", startDrag, true);
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) endDrag();
        });
      }

      function setupOverlayKeyboardScroll() {
        if (!window.api || typeof window.api.on !== "function") return;
        const container = document.querySelector(".overlay-container");
        if (!container) return;

        window.api.on("overlay:scroll-page", (payload) => {
          const dir =
            payload && typeof payload === "object"
              ? payload.direction
              : payload;
          const direction = String(dir || "").toLowerCase();
          const page = Math.max(120, Math.round(container.clientHeight * 0.85));
          if (direction === "up") {
            container.scrollBy({ top: -page, behavior: "smooth" });
            return;
          }
          if (direction === "down") {
            container.scrollBy({ top: page, behavior: "smooth" });
          }
        });
      }

      function setupOverlayDragRegion() {
        if (
          !window.api ||
          typeof window.api.setOverlayDragRegionHeight !== "function"
        ) {
          return;
        }
        const top = document.querySelector(".overlay-top");
        if (!top) return;

        const sendHeight = () => {
          const rect = top.getBoundingClientRect();
          if (rect && rect.height) {
            window.api.setOverlayDragRegionHeight(Math.round(rect.height));
          }
        };

        try {
          const ro = new ResizeObserver(() => sendHeight());
          ro.observe(top);
        } catch {
          window.addEventListener("resize", sendHeight);
        }

        sendHeight();
      }

      window.onload = () => {
        window.api.requestCurrentConfig?.();
        setupOverlayKeyboardScroll();
        setupOverlayDragRegion();
      };
    </script>
  </body>
</html>
