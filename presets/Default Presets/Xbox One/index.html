<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Popup Animation</title>
    <meta name="duration" content="10000" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      body {
        transform-origin: center center;
      }
    </style>
  </head>
  <body>
    <meta width="600" height="160" />
    <div class="ach">
      <div class="achievement-banner animated">
        <div class="achievement-loader"></div>
        <div class="achievement-loader"></div>
        <div class="achievement-loader"></div>
        <div class="achievement-loader"></div>
        <div class="achievement-loader"></div>
        <div class="achievement-trophy xbox-icon xbox-logo"></div>
        <div class="achievement-content">
          <div class="icon">
            <img src="" alt="Icon" />
          </div>
          <div class="text_wrap">
            <p class="title"></p>
            <span class="detail"></span>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const container = document.querySelector(".ach");
        const titleEl = document.querySelector(".title");
        const detailEl = document.querySelector(".detail");
        const iconEl = document.querySelector(".icon img");
        const durationMeta = document.querySelector('meta[name="duration"]');
        const frameMeta = document.querySelector("meta[width][height]");
        const baseFrameWidth = Math.max(
          0,
          Number(frameMeta?.getAttribute("width")) || 0
        );
        const HORIZONTAL_SAFE_MARGIN_PX = 24;
        const MIN_EXPANDED_WIDTH_PX = 450;
        const baseTotal = Math.max(1, Number(durationMeta?.content || 10000));
        const extendedModeThreshold = 7000;
        const manualVisualBaseTotal = 8400;
        const getCloseDelay = () =>
          Math.max(0, Number(durationMeta?.content || 10000));
        let closeDelay = getCloseDelay();

        if (!container || !titleEl || !detailEl || !iconEl) {
          return;
        }

        let closeTimer = null;
        const MARGIN_X = 30;
        const MARGIN_BOTTOM = 0;
        const MARGIN_TOP = 0;
        const TOP_TRANSLATE_ADJUST_PX = -50;
        function notifyScreenshotReady(delayMs = 0) {
          const safeDelay = Math.max(0, Number(delayMs) || 0);
          setTimeout(() => {
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                window.api?.notificationRenderReady?.();
              });
            });
          }, safeDelay);
        }
        const rootFontSize =
          parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;

        const toPx = (value, contextFontSize = rootFontSize) => {
          if (!value) return 0;
          const trimmed = String(value).trim();
          if (!trimmed) return 0;
          if (trimmed.endsWith("px")) return parseFloat(trimmed);
          if (trimmed.endsWith("em")) {
            return parseFloat(trimmed) * contextFontSize;
          }
          if (trimmed.endsWith("rem")) {
            return parseFloat(trimmed) * rootFontSize;
          }
          return parseFloat(trimmed) || 0;
        };

        const closeWindow = () => {
          window.api?.closeNotificationWindow?.();
          window.electronAPI?.closeNotificationWindow?.();
        };

        const scheduleClose = () => {
          if (closeTimer) {
            clearTimeout(closeTimer);
          }
          closeTimer = setTimeout(() => {
            closeWindow();
            closeTimer = null;
          }, closeDelay);
        };

        const applyScale = (value) => {
          const numeric = parseFloat(value);
          const safeScale =
            Number.isFinite(numeric) && numeric > 0 ? numeric : 1;
          container.style.setProperty("--scale", String(safeScale));
        };

        const configureManualTimeline = (totalMs) => {
          const safeTotal = Math.max(1, Number(totalMs) || manualVisualBaseTotal);
          const toMs = (value) => `${Math.max(0, Math.round(value))}ms`;
          const textDelayExtension = Math.max(
            0,
            safeTotal - extendedModeThreshold
          );
          const bannerDelay = 1000;
          const bannerIn = 1500;
          const bannerOut = 1000;
          const bannerOutDelay = 5000 + textDelayExtension;
          const iconDelay = 1000;
          const iconIn = 450;
          const iconOut = 450;
          const iconOutDelay = 5050 + textDelayExtension;
          const trophyDelay = 1000;
          const trophyIn = 400;
          const trophyOut = 400;
          const trophyOutDelay = 4600 + textDelayExtension;
          const loaderTimings = [
            { delay: 0, in: 700, out: 700, outDelay: 6300 + textDelayExtension },
            { delay: 100, in: 650, out: 650, outDelay: 5950 + textDelayExtension },
            { delay: 250, in: 600, out: 600, outDelay: 5650 + textDelayExtension },
            { delay: 500, in: 550, out: 550, outDelay: 5450 + textDelayExtension },
            { delay: 750, in: 500, out: 500, outDelay: 5250 + textDelayExtension },
          ];
          const titleDelay = 1400;
          const titleIn = 1600;
          const titleOut = 600;
          const detailGap = 100;
          const detailIn = 900;
          const detailOut = 1000;
          const availableTextHold = Math.max(
            0,
            safeTotal -
              (titleDelay +
                titleIn +
                titleOut +
                detailGap +
                detailIn +
                detailOut)
          );
          const titleHold = Math.round(availableTextHold * 0.4);
          const detailHold = availableTextHold - titleHold;
          const titleOutDelay = titleDelay + titleIn + titleHold;
          const detailDelay = titleOutDelay + titleOut + detailGap;
          const detailOutDelay = detailDelay + detailIn + detailHold;

          container.classList.add("manual-duration");
          document.documentElement.style.setProperty("--timeline-scale", "1");
          container.style.setProperty("--manual-banner-delay", toMs(bannerDelay));
          container.style.setProperty("--manual-banner-in", toMs(bannerIn));
          container.style.setProperty("--manual-banner-out", toMs(bannerOut));
          container.style.setProperty(
            "--manual-banner-out-delay",
            toMs(bannerOutDelay)
          );
          container.style.setProperty("--manual-icon-delay", toMs(iconDelay));
          container.style.setProperty("--manual-icon-in", toMs(iconIn));
          container.style.setProperty("--manual-icon-out", toMs(iconOut));
          container.style.setProperty(
            "--manual-icon-out-delay",
            toMs(iconOutDelay)
          );
          container.style.setProperty("--manual-trophy-delay", toMs(trophyDelay));
          container.style.setProperty("--manual-trophy-in", toMs(trophyIn));
          container.style.setProperty("--manual-trophy-out", toMs(trophyOut));
          container.style.setProperty(
            "--manual-trophy-out-delay",
            toMs(trophyOutDelay)
          );
          loaderTimings.forEach((loader, index) => {
            const varIndex = index + 1;
            container.style.setProperty(
              `--manual-loader-${varIndex}-delay`,
              toMs(loader.delay)
            );
            container.style.setProperty(
              `--manual-loader-${varIndex}-in`,
              toMs(loader.in)
            );
            container.style.setProperty(
              `--manual-loader-${varIndex}-out`,
              toMs(loader.out)
            );
            container.style.setProperty(
              `--manual-loader-${varIndex}-out-delay`,
              toMs(loader.outDelay)
            );
          });
          container.style.setProperty("--manual-title-delay", toMs(titleDelay));
          container.style.setProperty("--manual-title-in", toMs(titleIn));
          container.style.setProperty("--manual-title-out", toMs(titleOut));
          container.style.setProperty(
            "--manual-title-out-delay",
            toMs(titleOutDelay)
          );
          container.style.setProperty("--manual-detail-delay", toMs(detailDelay));
          container.style.setProperty("--manual-detail-in", toMs(detailIn));
          container.style.setProperty("--manual-detail-out", toMs(detailOut));
          container.style.setProperty(
            "--manual-detail-out-delay",
            toMs(detailOutDelay)
          );
        };

        const resetAnimations = (elements) => {
          elements.forEach((el) => {
            if (!el) return;
            el.style.animation = "none";
            el.style.webkitAnimation = "none";
            el.style.mozAnimation = "none";
            void el.offsetWidth;
            el.style.animation = "";
            el.style.webkitAnimation = "";
            el.style.mozAnimation = "";
          });
        };

        const restartAnimation = () => {
          const animatedNodes = container.querySelectorAll(
            ".achievement-banner, .achievement-loader, .achievement-trophy, .icon img, .achievement-banner .title, .achievement-banner .detail"
          );
          resetAnimations(Array.from(animatedNodes));
        };

        const restoreMarqueeSource = (element, innerClass) => {
          if (!element) return;
          try {
            element.getAnimations().forEach((a) => a.cancel());
          } catch {}
          const existing = element.querySelector(`.${innerClass}`);
          if (existing) {
            try {
              existing.getAnimations().forEach((a) => a.cancel());
            } catch {}
            const text = existing.textContent || "";
            existing.remove();
            element.textContent = text;
          }
          element.classList.remove("marquee");
        };

        const applyMarqueeIfOverflow = (
          element,
          {
            innerClass,
            overflowXThreshold = 0,
            overflowYThreshold = 0,
            minDuration = 3000,
            speedDivisor = 50,
            delay = 1200,
            extraPadding = 24,
          }
        ) => {
          if (!element) return false;
          try {
            element.getAnimations().forEach((a) => a.cancel());
          } catch {}
          element.classList.remove("marquee");
          void element.offsetWidth;
          const overflowX =
            (element.scrollWidth || 0) - (element.clientWidth || 0);
          const overflowY =
            (element.scrollHeight || 0) - (element.clientHeight || 0);
          if (
            overflowX > overflowXThreshold ||
            overflowY > overflowYThreshold
          ) {
            const text = element.textContent || "";
            const innerSpan = document.createElement("span");
            innerSpan.className = innerClass;
            innerSpan.textContent = text;
            element.textContent = "";
            element.appendChild(innerSpan);
            element.classList.add("marquee");
            void element.offsetWidth;
            const distance = Math.ceil(
              Math.max(
                0,
                (innerSpan.scrollWidth || 0) - (element.clientWidth || 0)
              ) + extraPadding
            );
            innerSpan.animate(
              [
                { transform: "translateX(0)" },
                { transform: `translateX(-${distance}px)` },
              ],
              {
                duration: Math.max(
                  minDuration,
                  Math.round(distance / speedDivisor) * 1000
                ),
                delay,
                easing: "linear",
                fill: "both",
              }
            );
            return true;
          }
          return false;
        };

        const computeFromTopFallback = () => {
          try {
            const y = (window.screenY ?? window.screenTop ?? 0) | 0;
            const sh = (screen.availHeight || screen.height || 1080) | 0;
            const wh = (window.outerHeight || window.innerHeight || 0) | 0;
            const centerY = y + wh / 2;
            return centerY < sh / 2;
          } catch {
            return false;
          }
        };

        const applyAnchoringFromPosition = (posRaw) => {
          const raw = String(posRaw || "").toLowerCase();
          const tokens = raw
            .replace(/[^a-z]+/g, " ")
            .trim()
            .split(/\s+/)
            .filter(Boolean);

          let fromTop = tokens.includes("top") || tokens.includes("t");
          let fromBottom = tokens.includes("bottom") || tokens.includes("b");
          if (!fromTop && !fromBottom) {
            fromTop = computeFromTopFallback();
            fromBottom = !fromTop;
          }

          const atLeft = tokens.includes("left") || tokens.includes("l");
          const atRight = tokens.includes("right") || tokens.includes("r");
          const atCenter = !atLeft && !atRight;

          container.style.top = fromTop ? `${MARGIN_TOP}px` : "auto";
          container.style.bottom = fromTop ? "auto" : `${MARGIN_BOTTOM}px`;
          container.style.setProperty("--origin-y", fromTop ? "top" : "bottom");
          const topTranslatePx = fromTop
            ? Math.round(
                TOP_TRANSLATE_ADJUST_PX *
                  Math.max(
                    0.1,
                    parseFloat(
                      getComputedStyle(container).getPropertyValue("--scale")
                    ) || 1
                  )
              )
            : 0;
          container.style.setProperty(
            "--translate-y",
            `${topTranslatePx}px`
          );

          if (atLeft) {
            container.style.left = `${MARGIN_X}px`;
            container.style.right = "auto";
            container.style.setProperty("--translate-x", "0%");
            container.style.setProperty("--origin-x", "left");
            container.style.setProperty("--banner-left-collapsed", "0px");
            container.style.setProperty("--banner-left-expanded", "0px");
            container.style.setProperty("--banner-right-collapsed", "auto");
            container.style.setProperty("--banner-right-expanded", "auto");
          } else if (atRight) {
            container.style.right = `${MARGIN_X}px`;
            container.style.left = "auto";
            container.style.setProperty("--translate-x", "0%");
            container.style.setProperty("--origin-x", "right");
            container.style.setProperty("--banner-left-collapsed", "auto");
            container.style.setProperty("--banner-left-expanded", "auto");
            container.style.setProperty("--banner-right-collapsed", "0px");
            container.style.setProperty("--banner-right-expanded", "0px");
          } else {
            container.style.left = "50%";
            container.style.right = "auto";
            container.style.setProperty("--translate-x", "-50%");
            container.style.setProperty("--origin-x", "center");
            container.style.setProperty(
              "--banner-left-collapsed",
              "calc(50% - (var(--ach-collapsed-width, 100px) / 2))"
            );
            container.style.setProperty(
              "--banner-left-expanded",
              "calc(50% - (var(--ach-width, 600px) / 2))"
            );
            container.style.setProperty("--banner-right-collapsed", "auto");
            container.style.setProperty("--banner-right-expanded", "auto");
          }
        };

        const updateContainerWidth = () => {
          const previousInlineWidth = container.style.width;
          container.style.width = "auto";
          const autoWidth = Math.ceil(container.getBoundingClientRect().width);
          container.style.width = previousInlineWidth;

          const styles = getComputedStyle(container);
          const fontSize = parseFloat(styles.fontSize) || 16;
          const collapsedRaw = (
            styles.getPropertyValue("--ach-collapsed-width") || ""
          ).trim();
          const collapsedPx = Math.max(0, toPx(collapsedRaw, fontSize));

          const textWrap = container.querySelector(".text_wrap");
          let textWidth = 0;
          let offsetLeft = 0;
          if (textWrap) {
            const twStyles = getComputedStyle(textWrap);
            const originalPosition = textWrap.style.position;
            const originalWidth = textWrap.style.width;
            const originalLeft = textWrap.style.left;
            const originalRight = textWrap.style.right;
            const originalTop = textWrap.style.top;

            textWrap.style.position = "static";
            textWrap.style.width = "auto";
            textWrap.style.left = "auto";
            textWrap.style.right = "auto";
            textWrap.style.top = "auto";

            textWidth = Math.ceil(textWrap.getBoundingClientRect().width);

            textWrap.style.position = originalPosition;
            textWrap.style.width = originalWidth;
            textWrap.style.left = originalLeft;
            textWrap.style.right = originalRight;
            textWrap.style.top = originalTop;

            offsetLeft = toPx(twStyles.left, fontSize);
          }

          const padding =
            (parseFloat(styles.paddingLeft) || 0) +
            (parseFloat(styles.paddingRight) || 0);
          const constructedWidth = Math.ceil(offsetLeft + textWidth + padding);

          const baseWidth = Math.max(autoWidth, constructedWidth, collapsedPx);
          const requestedWidth = Math.max(
            baseWidth + 4,
            collapsedPx,
            MIN_EXPANDED_WIDTH_PX
          );
          const currentScale = Math.max(
            0.1,
            parseFloat(styles.getPropertyValue("--scale")) || 1
          );
          const viewportWidth =
            window.innerWidth || document.documentElement.clientWidth || 0;
          const scaledWindowLimit =
            viewportWidth > 0
              ? Math.max(
                  collapsedPx,
                  Math.floor(viewportWidth / currentScale) -
                    HORIZONTAL_SAFE_MARGIN_PX * 2
                )
              : baseFrameWidth;
          const maxExpandedWidth = Math.max(
            collapsedPx,
            Math.min(
              baseFrameWidth || requestedWidth,
              scaledWindowLimit || requestedWidth
            )
          );
          const finalWidth = Math.max(
            Math.min(requestedWidth, maxExpandedWidth),
            collapsedPx
          );
          container.style.setProperty("--ach-width", `${finalWidth}px`);
        };

        const subscribe = (handler) => {
          if (window.api && typeof window.api.onNotification === "function") {
            window.api.onNotification(handler);
            return true;
          }
          if (
            window.electronAPI &&
            typeof window.electronAPI.onNotification === "function"
          ) {
            window.electronAPI.onNotification(handler);
            return true;
          }
          return false;
        };

        const onNotification = (notificationData = {}) => {
          restoreMarqueeSource(titleEl, "title-inner");
          restoreMarqueeSource(detailEl, "detail-inner");

          titleEl.textContent =
            notificationData.displayName != null
              ? String(notificationData.displayName)
              : "";
          detailEl.textContent =
            notificationData.description != null
              ? String(notificationData.description)
              : "";

          const rawIcon = notificationData.iconPath || notificationData.icon;
          if (rawIcon) {
            const normalized = String(rawIcon).replace(/\\/g, "/");
            iconEl.src = normalized.startsWith("file://")
              ? normalized
              : `file:///${normalized}`;
          }

          const total = getCloseDelay();
          const useExtendedHoldMode = total > extendedModeThreshold;
          const timelineScale = useExtendedHoldMode
            ? 1
            : Math.max(0.1, total / baseTotal);
          if (useExtendedHoldMode) {
            configureManualTimeline(total);
          } else {
            container.classList.remove("manual-duration");
            document.documentElement.style.setProperty(
              "--timeline-scale",
              timelineScale.toFixed(4)
            );
          }
          applyScale(notificationData.scale);
          applyAnchoringFromPosition(
            notificationData.position ??
              notificationData.presetPosition ??
              notificationData.pos ??
              notificationData.corner ??
              ""
          );

          requestAnimationFrame(() => {
            closeDelay = total;
            applyMarqueeIfOverflow(titleEl, {
              innerClass: "title-inner",
              overflowXThreshold: 2,
              overflowYThreshold: 1,
              minDuration: 3000,
              speedDivisor: 50,
              delay: 1200,
              extraPadding: 24,
            });
            applyMarqueeIfOverflow(detailEl, {
              innerClass: "detail-inner",
              overflowXThreshold: 2,
              overflowYThreshold: 1,
              minDuration: 4000,
              speedDivisor: 40,
              delay: 1400,
              extraPadding: 24,
            });
            updateContainerWidth();
            restartAnimation();
            notifyScreenshotReady(
              Math.max(700, Math.round(2600 * timelineScale))
            );
            scheduleClose();
          });
        };

        applyScale(1);
        applyAnchoringFromPosition("");

        if (!subscribe(onNotification)) {
          applyScale(1);
        }
      });
    </script>
  </body>
</html>
