<!doctype html>
<html lang="en" class="tray-menu-html">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tray Menu</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="tray-menu.css" />
  </head>
  <body class="tray-menu-body">
    <div class="tray-menu">
      <div id="trayMenuRecentGames" class="tray-menu__recent hidden" role="group" data-i18n-aria-label="dashboard.sort.lastPlayed"></div>
      <div id="trayMenuRecentSeparator" class="tray-menu__separator hidden" role="separator"></div>
      <button
        id="trayMenuShow"
        class="tray-menu__item"
        data-action="show"
        data-i18n="trayMenuShow"
      >
        Show
      </button>
      <button
        id="trayMenuSettings"
        class="tray-menu__item"
        data-action="settings"
        data-i18n="trayMenuSettings"
      >
        Settings
      </button>
      <button
        id="trayMenuResumeStartup"
        class="tray-menu__item hidden"
        data-action="resume-startup"
        data-i18n="trayMenuResumeStartup"
      >
        Resume Startup (Mute all)
      </button>
      <button
        id="trayMenuQuit"
        class="tray-menu__item tray-menu__item--danger"
        data-action="quit"
        data-i18n="trayMenuQuit"
      >
        Quit
      </button>
    </div>
    <script src="utils/i18n-ui.js"></script>
    <script src="utils/app-theme.js"></script>
    <script src="tray-menu.js"></script>
  </body>
</html>
